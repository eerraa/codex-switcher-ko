name: Korean localization
on:
  push:
    branches: [main, 'sync/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run build
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.94.0
      - run: npm ci
      - run: npm run build
      - run: cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
