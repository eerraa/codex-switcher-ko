name: Desktop compatibility
on:
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'scripts/*compat*', 'scripts/windows-ui-smoke.mjs', 'scripts/fixtures/windows-*', '.github/workflows/windows-compat.yml']
  push:
    branches: ['fix/windows-compat']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/windows-compat.test.mjs
      - run: node scripts/windows-ui-smoke.mjs
      - run: cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib clipboard::tests
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib tray_position::tests
      - if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib desktop::tests
      - if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib codex_ua::windows_tests
      - if: runner.os == 'Windows'
        env:
          CODEX_SWITCHER_DISPOSABLE_TESTS: '1'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib disposable_windows_clipboard_roundtrip -- --ignored
